name: indutech-tickets-poc

services:
  # ============================================================
  # Redpanda - Broker compatible Kafka API
  # ============================================================
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: redpanda
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - "18081:18081"
      - "18082:18082"
      - "19092:19092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - indutech-net

  # ============================================================
  # Redpanda Console
  # ============================================================
  redpanda-console:
    image: redpandadata/console:v2.7.2
    container_name: redpanda-console
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      KAFKA_SCHEMAREGISTRY_ENABLED: "true"
      KAFKA_SCHEMAREGISTRY_URLS: http://redpanda:8081
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8090:8080"
    networks:
      - indutech-net

  # ============================================================
  # Topic Setup - crée le topic au démarrage
  # ============================================================
  topic-setup:
    image: redpandadata/redpanda:v24.2.7
    container_name: topic-setup
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: >
      bash -c "
      rpk topic create client_tickets --partitions 3 --replicas 1 --brokers redpanda:9092 || true;
      echo 'Topic client_tickets ready';
      "
    networks:
      - indutech-net

  # ============================================================
  # Producer Python
  # ============================================================
  producer:
    build: ./producer
    container_name: producer
    depends_on:
      redpanda:
        condition: service_healthy
      topic-setup:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC: client_tickets
      INTERVAL_MIN: "0.5"
      INTERVAL_MAX: "2.0"
    networks:
      - indutech-net
    restart: on-failure

  # ============================================================
  # Consumer PySpark
  # ============================================================
  consumer:
    build: ./consumer
    container_name: consumer
    depends_on:
      redpanda:
        condition: service_healthy
      topic-setup:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKER: redpanda:9092
      KAFKA_TOPIC: client_tickets
      OUTPUT_PATH: /app/output
    volumes:
      - ./output:/app/output
    networks:
      - indutech-net
    restart: on-failure

networks:
  indutech-net:
    driver: bridge
