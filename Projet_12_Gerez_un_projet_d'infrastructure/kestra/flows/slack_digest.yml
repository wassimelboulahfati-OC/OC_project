id: slack_digest
namespace: sportdata

description: |
  Publication Slack d'un message par activité sportive de la veille,
  pour favoriser l'émulation entre salariés (cron : tous les jours à 8h).
  Requête SQL native Kestra (toutes les lignes) + envoi Slack par activité
  via script Python (contournement SSL entreprise, throttling anti rate-limit).

variables:
  runner_image: sds-runner:latest
  docker_network: projet_12_gerez_un_projet_dinfrastructure_default

tasks:
  - id: activites_veille
    type: io.kestra.plugin.jdbc.postgresql.Query
    url: jdbc:postgresql://postgres_data:5432/sport_data
    username: sds_admin
    password: "{{ secret('DATA_DB_PASSWORD') }}"
    fetchType: FETCH
    sql: |
      select
        r.prenom || ' ' || r.nom as nom_complet,
        a.type_activite,
        a.date_activite
      from staging.stg_activites a
      join staging.stg_rh r on r.id_salarie = a.id_salarie
      where a.date_activite::date = current_date - interval '1 day'
      order by r.nom, r.prenom


  - id: slack
    type: io.kestra.plugin.scripts.python.Commands
    containerImage: "{{ vars.runner_image }}"
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      pullPolicy: NEVER
      networkMode: "{{ vars.docker_network }}"
    env:
      SLACK_WEBHOOK_URL: "{{ secret('SLACK_WEBHOOK_URL') }}"
      SLACK_VERIFY_SSL: "false"
      ACTIVITES_JSON: "{{ outputs.activites_veille.rows | toJson }}"
    commands:
      - python /app/python/post_slack.py

triggers:
  - id: quotidien
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "0 8 * * *"
