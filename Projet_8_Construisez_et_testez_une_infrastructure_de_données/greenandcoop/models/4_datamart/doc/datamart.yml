version: 2

models:
  - name: dim_weather_stations
    description: >
      Table de dimension des stations météorologiques. Contient les métadonnées
      statiques de toutes les stations (WU amateurs et SYNOP infoclimat).
      Alimentée par le seed dim_weather_stations_metadata.

    columns:
      - name: station_id
        description: "Identifiant unique de la station (clé primaire)."
        tests:
          - not_null
          - unique

      - name: station_name
        description: "Nom descriptif de la station."

      - name: latitude
        description: "Latitude géographique en degrés décimaux."

      - name: longitude
        description: "Longitude géographique en degrés décimaux."

      - name: elevation_m
        description: "Altitude de la station en mètres."

      - name: city
        description: "Ville ou localité de la station."

      - name: country
        description: "Code pays ISO 2 lettres (FR, BE)."

      - name: hardware
        description: "Type de matériel de la station."

      - name: software
        description: "Logiciel utilisé par la station."

      - name: source_system
        description: "Système source des données (weather_underground ou infoclimat)."

  - name: fact_weather_observations
    description: >
      Table de faits centrale du schéma en étoile. Contient toutes les observations
      météorologiques standardisées, unifiées depuis les trois sources (infoclimat,
      WU Ichtegem, WU La Madeleine). Une ligne = une mesure à un instant donné
      pour une station donnée.

    columns:
      - name: observation_id
        description: "Clé de substitution (MD5 de station_id + observed_at)."
        tests:
          - not_null
          - unique

      - name: station_id
        description: "Clé étrangère vers dim_weather_stations."
        tests:
          - not_null
          - relationships:
              to: ref('dim_weather_stations')
              field: station_id

      - name: observed_at
        description: "Horodatage exact de la mesure (UTC)."
        tests:
          - not_null

      - name: observation_date
        description: "Date de la mesure (sans heure), utile pour des agrégations journalières."

      - name: year
        description: "Année de la mesure."

      - name: month
        description: "Mois de la mesure."

      - name: hour
        description: "Heure de la mesure."

      - name: source_system
        description: "Système source (infoclimat ou weather_underground)."

      - name: temperature_c
        description: "Température de l'air en °C."

      - name: dew_point_c
        description: "Température du point de rosée en °C."

      - name: humidity_pct
        description: "Humidité relative en %."

      - name: pressure_hpa
        description: "Pression atmosphérique en hPa."

      - name: wind_speed_kmh
        description: "Vitesse moyenne du vent en km/h."

      - name: wind_gust_kmh
        description: "Vitesse des rafales de vent en km/h."

      - name: wind_direction_deg
        description: "Direction du vent en degrés (infoclimat uniquement)."

      - name: wind_direction_text
        description: "Direction du vent en texte cardinal (WU uniquement)."

      - name: precip_rate_mmh
        description: "Intensité des précipitations en mm/h."

      - name: precip_accum_mm
        description: "Cumul total des précipitations en mm (WU uniquement)."

      - name: precip_accum_3h_mm
        description: "Cumul des précipitations sur 3h en mm (infoclimat uniquement)."

      - name: uv_index
        description: "Indice UV (WU uniquement)."

      - name: solar_radiation_wm2
        description: "Rayonnement solaire en W/m² (WU uniquement)."

      - name: visibility_m
        description: "Visibilité horizontale en mètres (infoclimat uniquement)."

      - name: cloud_cover_oktas
        description: "Couverture nuageuse en octas (infoclimat uniquement)."

      - name: snow_ground_cm
        description: "Hauteur de neige au sol en cm (infoclimat uniquement)."

      - name: weather_code_omm
        description: "Code temps OMM (infoclimat uniquement)."
